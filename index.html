<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <title>ŞäherMarket Partner PRO — Dükan Dolandyryş Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0b1120; --surface:#111827; --card:#182235; --soft:#1f2c44;
      --ink:#f8fafc; --sub:#94a3b8; --border:rgba(255,255,255,.09);
      --accent:#10b981; --accent2:#059669; --orange:#f97316; --blue:#3b82f6; --danger:#ef4444;
      --grad:linear-gradient(135deg,#10b981,#0d9488);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;background:radial-gradient(circle at top right,#064e3b 0%,#0b1120 45%);
      color:var(--ink);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.4}
    button,input,textarea,select{font-family:inherit;color:inherit}

    /* ===== LOGIN ===== */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-card{width:100%;max-width:410px;background:rgba(24,34,53,.9);backdrop-filter:blur(20px);
      border:1px solid var(--border);border-radius:26px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
    .logo-badge{width:52px;height:52px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin-bottom:14px}
    .field{margin-top:11px}
    .field label{display:block;font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;background:rgba(11,17,32,.72);border:1.5px solid var(--border);
      border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;color:#fff;outline:none}
    .field textarea{resize:vertical;min-height:60px}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
    .btn-primary{width:100%;height:45px;margin-top:15px;border:none;border-radius:13px;background:var(--grad);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
    .err-box{display:none;margin-top:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:10px;border-radius:11px;font-size:12px;font-weight:700}
    .err-box.show{display:block}
    .demo-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:145px;overflow:auto;margin-top:8px}
    .demo-acc{border:1px solid var(--border);background:rgba(255,255,255,.04);border-radius:10px;padding:7px;text-align:left;cursor:pointer}
    .demo-acc strong{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .demo-acc span{font-size:10px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ===== DASHBOARD ===== */
    .alarm-banner{display:none;background:linear-gradient(90deg,#ea580c,#ec4899);color:#fff;padding:12px 16px;border-radius:16px;
      margin-bottom:14px;align-items:center;justify-content:space-between;font-weight:800;animation:pulseBg 1.2s infinite}
    .alarm-banner.show{display:flex}
    @keyframes pulseBg{0%,100%{opacity:1}50%{opacity:.78}}

    .dash-shell{max-width:1040px;margin:0 auto;padding:16px 14px 90px}
    .dash-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      background:var(--card);border:1px solid var(--border);border-radius:22px;padding:14px 16px;margin-bottom:14px}
    .store-id-wrap{display:flex;align-items:center;gap:12px}
    .store-avatar{width:52px;height:52px;border-radius:15px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex-shrink:0;border:1px solid var(--border)}
    .store-avatar img{width:100%;height:100%;object-fit:cover}
    .top-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .status-toggle{border:none;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer}
    .status-toggle.open{background:rgba(16,185,129,.18);color:#34d399;border:1px solid rgba(16,185,129,.4)}
    .status-toggle.closed{background:rgba(239,68,68,.18);color:#f87171;border:1px solid rgba(239,68,68,.4)}
    .top-btn{border:1px solid var(--border);background:var(--soft);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}

    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px}
    .stat-lbl{font-size:11px;color:var(--sub);font-weight:600}
    .stat-val{font-size:21px;font-weight:800;margin-top:3px}
    .stat-val.green{color:#34d399}
    .stat-val.orange{color:#fb923c}

    .tabs{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
    .tab-btn{border:1px solid var(--border);background:var(--card);border-radius:13px;padding:10px 14px;font-size:12.5px;font-weight:800;color:var(--sub);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
    .tab-btn.active{background:var(--grad);border-color:transparent;color:#fff}
    .pill-cnt{background:rgba(0,0,0,.25);padding:2px 7px;border-radius:999px;font-size:11px}

    /* ===== ORDERS ===== */
    .filter-row{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto}
    .f-chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap}
    .f-chip.active{background:#fff;color:#0b1120;border-color:#fff}
    .orders-list{display:grid;grid-template-columns:1fr;gap:12px}
    .order-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:10px}
    .order-card.is-new{border-color:rgba(16,185,129,.65);box-shadow:0 0 0 1px rgba(16,185,129,.3)}
    .oc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .oc-badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
    .st-new{background:rgba(59,130,246,.2);color:#93c5fd}
    .st-accepted{background:rgba(245,158,11,.2);color:#fcd34d}
    .st-preparing{background:rgba(249,115,22,.2);color:#fdba74}
    .st-onway{background:rgba(139,92,246,.2);color:#c4b5fd}
    .st-delivered{background:rgba(16,185,129,.2);color:#6ee7b7}
    .st-cancelled{background:rgba(239,68,68,.2);color:#fca5a5}
    .oc-cust{background:rgba(11,17,32,.48);border-radius:13px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
    .oc-item-row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
    .oc-actions{display:flex;gap:7px;flex-wrap:wrap}
    .act-btn{flex:1;min-width:105px;height:38px;border:none;border-radius:11px;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
    .act-btn.next{background:var(--grad);color:#fff}
    .act-btn.soft{background:var(--soft);color:#fff;flex:0 0 auto;padding:0 12px}
    .act-btn.cancel{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);flex:0 0 auto;padding:0 12px}

    /* ===== PRODUCTS ===== */
    .panel-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .bulk-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:16px;padding:11px 14px;margin-bottom:14px}
    .bulk-btns{display:flex;gap:6px;flex-wrap:wrap}
    .bulk-btn{border:none;border-radius:9px;padding:7px 11px;font-size:11.5px;font-weight:800;cursor:pointer;background:var(--soft);color:#fff}
    .bulk-btn.up{background:rgba(16,185,129,.22);color:#34d399}
    .bulk-btn.down{background:rgba(249,115,22,.22);color:#fdba74}

    .prod-manage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
    .pm-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px;display:flex;flex-direction:column;gap:10px}
    .pm-top{display:flex;align-items:center;gap:12px}
    .pm-thumb{width:54px;height:54px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0;overflow:hidden}
    .pm-thumb img{width:100%;height:100%;object-fit:cover}
    .pm-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding-top:8px;border-top:1px solid var(--border)}
    .pm-btn{height:34px;border:none;border-radius:10px;font-size:11.5px;font-weight:800;cursor:pointer}
    .pm-btn.in{background:rgba(16,185,129,.18);color:#34d399}
    .pm-btn.out{background:rgba(245,158,11,.18);color:#fcd34d}
    .pm-btn.edit{background:rgba(59,130,246,.18);color:#93c5fd}
    .pm-btn.del{background:rgba(239,68,68,.16);color:#fca5a5}

    /* ===== UPLOAD ===== */
    .upload-box{display:flex;align-items:center;gap:12px;background:rgba(11,17,32,.55);border:1.5px dashed rgba(255,255,255,.16);border-radius:14px;padding:10px;margin-top:6px;flex-wrap:wrap}
    .upload-preview{width:52px;height:52px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0}
    .upload-preview.wide{width:104px}
    .upload-preview img{width:100%;height:100%;object-fit:cover}
    .file-lbl{display:inline-flex;align-items:center;gap:5px;background:var(--grad);color:#fff;padding:7px 11px;border-radius:9px;font-size:11.5px;font-weight:800;cursor:pointer}
    .file-lbl input{display:none}
    .clear-img-btn{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.12);color:#fca5a5;padding:7px 10px;border-radius:9px;font-size:11.5px;font-weight:800;cursor:pointer}
    .url-small{width:100%;background:rgba(11,17,32,.7);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:11.5px;color:#fff;outline:none;margin-top:6px}

    /* ===== ANALYTICS CHART ===== */
    .chart-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px;padding:14px 4px 4px}
    .bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
    .bar-fill{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--grad);min-height:4px;transition:.3s}
    .bar-val{font-size:10px;color:#34d399;font-weight:800}
    .bar-lbl{font-size:10px;color:var(--sub);font-weight:700}

    /* ===== MODAL & TOAST ===== */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:80}
    .modal-overlay.open{display:flex}
    .modal-card{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--soft);color:#fff;font-weight:800;cursor:pointer}
    .empty{background:var(--card);border:1px dashed var(--border);border-radius:20px;padding:34px 20px;text-align:center;color:var(--sub)}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:#10b981;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:99}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:640px){.stats-grid{grid-template-columns:1fr 1fr}.form-row,.form-row-3{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- EDIT PRODUCT MODAL -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-card">
      <div class="modal-head"><h3 style="font-size:17px;font-weight:800;">✏️ Harydy üýtget</h3><button type="button" class="modal-close" id="closeEditModal">✕</button></div>
      <form id="editProdForm">
        <input type="hidden" id="eId" />
        <div class="field"><label>Harydyň ady *</label><input id="eTitle" required /></div>
        <div class="form-row">
          <div class="field"><label>Bahasy (m.) *</label><input id="ePrice" type="number" min="1" step="0.5" required /></div>

        </div>
        <div class="form-row-3">
          <div class="field"><label>Ölçegi</label><input id="eUnit" /></div>
          <div class="field"><label>Bölümçe</label><input id="eCat" /></div>
          <div class="field"><label>Emoji</label><input id="eEmoji" /></div>
        </div>
        <div class="field"><label>Düşündiriş</label><textarea id="eDesc"></textarea></div>
        <div class="field"><label>Goşmaça saýlawlar (her setirde: Ady:Baha — mysal: Uly porsiýa:10)</label><textarea id="eOpts" placeholder="Uly porsiýa:10&#10;Sogansyz:0"></textarea></div>
        <div class="field">
          <label>Harydyň suraty</label>
          <div class="upload-box">
            <div class="upload-preview" id="eImgPrev">📦</div>
            <div style="flex:1;min-width:170px;">
              <div style="display:flex;gap:6px;"><label class="file-lbl">📷 Surat ýükle<input type="file" accept="image/*" id="eImgFile" /></label><button type="button" class="clear-img-btn" id="eImgClear">Poz</button></div>
              <input class="url-small" id="eImgUrl" placeholder="ýa-da URL..." />
            </div>
          </div>
        </div>
        <button type="submit" class="btn-primary">Ýatda sakla ✓</button>
      </form>
    </div>
  </div>

  <!-- CANCEL REASON MODAL -->
  <div class="modal-overlay" id="cancelModal">
    <div class="modal-card" style="max-width:390px;">
      <div class="modal-head"><h3 style="font-size:17px;font-weight:800;">❌ Ýatyrma sebäbi</h3><button type="button" class="modal-close" id="closeCancelModal">✕</button></div>
      <input type="hidden" id="cancelOrderCode" />
      <div class="field"><label>Müşderä görkeziljek sebäp:</label>
        <select id="cancelReasonSel">
          <option value="Haryt gutardy">Haryt gutardy</option>
          <option value="Kurýer häzir elýeterli däl">Kurýer häzir elýeterli däl</option>
          <option value="Salgy eltip bermek çäginden daşda">Salgy eltip bermek çäginden daşda</option>
          <option value="Dükan ýapylýar">Dükan ýapylýar</option>
        </select>
      </div>
      <button type="button" class="btn-primary" style="background:#dc2626;" id="confirmCancelBtn">Sargydy ýatyr</button>
    </div>
  </div>

  <!-- CLIENT SITE URL MODAL -->
  <div class="modal-overlay" id="siteUrlModal">
    <div class="modal-card" style="max-width:400px;">
      <div class="modal-head"><h3 style="font-size:17px;font-weight:800;">🌐 Müşderi saýtynyň salgysy</h3><button type="button" class="modal-close" id="closeSiteUrlModal">✕</button></div>
      <div class="field"><label>URL salgysy</label><input id="clientUrlInput" type="url" placeholder="https://..." /></div>
      <button type="button" class="btn-primary" id="saveClientUrlBtn">Ýatda sakla we aç →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      'use strict';

      const CONFIG = {
        SUPABASE_URL: 'https://zkypuqmwovjuuplirzig.supabase.co',
        SUPABASE_ANON_KEY: 'sb_publishable_Rhlt7E7dYumty3PpE6Sp6Q_AzkHOp-l',
        CLIENT_SITE_URL: '',
        currency: 'm.'
      };

      const sb = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase)
        ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY)
        : null;

      const STORE_ACCOUNTS = [
        { email:'altyn@sahermarket.tm', pass:'123456', storeId:'altyn_sac', name:'Altyn Saçak' },
        { email:'pizza@sahermarket.tm', pass:'123456', storeId:'dost_pizza', name:'Dost Pizza & Burger' },
        { email:'tamdyr@sahermarket.tm', pass:'123456', storeId:'tamdyr', name:'Tamdyr Çörek & Süýji' },
        { email:'bereket@sahermarket.tm', pass:'123456', storeId:'bereket', name:'Bereket Market' },
        { email:'bazar@sahermarket.tm', pass:'123456', storeId:'bazar_ter', name:'Ter Bag & Et' },
        { email:'cesme@sahermarket.tm', pass:'123456', storeId:'cesme', name:'Çeşme Suw' }
      ];

      const DB_STORES_KEY   = 'sm_db_stores_v1';
      const DB_PRODUCTS_KEY = 'sm_db_products_v1';
      const DB_ORDERS_KEY   = 'sm_db_orders_v1';
      const DB_COUPONS_KEY  = 'sm_db_coupons_v1';
      const DB_REVIEWS_KEY  = 'sm_db_reviews_v1';
      const SESSION_KEY     = 'sm_partner_session_v1';
      const CLIENT_URL_KEY  = 'sm_client_site_url_v1';

      function loadJSON(k, f) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch { return f; } }
      function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
      function esc(s) { return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
      function fmt(v) { return Number(v || 0).toLocaleString('tr-TR') + ' ' + CONFIG.currency; }

      let toastTimer;
      function toast(msg) {
        const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
      }

      // Loud pleasant bell alarm for new orders
      function playAlarm() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          [0, 0.22, 0.44].forEach((delay, i) => {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(i === 2 ? 1174 : 880, ctx.currentTime + delay);
            g.gain.setValueAtTime(0.22, ctx.currentTime + delay);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.25);
            o.connect(g); g.connect(ctx.destination);
            o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + 0.26);
          });
        } catch {}
      }

      // Upload to Supabase Storage ('media' bucket) with automatic base64 fallback
      function compressToBlobAndDataUrl(file, maxW, quality) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => {
            const img = new Image();
            img.onload = () => {
              let w = img.width, h = img.height;
              if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
              const c = document.createElement('canvas'); c.width = w; c.height = h;
              c.getContext('2d').drawImage(img, 0, 0, w, h);
              const dataUrl = c.toDataURL('image/jpeg', quality || 0.8);
              c.toBlob(blob => resolve({ blob, dataUrl }), 'image/jpeg', quality || 0.8);
            };
            img.onerror = reject; img.src = e.target.result;
          };
          reader.onerror = reject; reader.readAsDataURL(file);
        });
      }

      async function uploadImageSmart(file, maxW) {
        const { blob, dataUrl } = await compressToBlobAndDataUrl(file, maxW || 600, 0.8);
        if (sb && state.session) {
          try {
            const path = state.session.storeId + '/' + Date.now() + '.jpg';
            const { error } = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
            if (!error) {
              const { data } = sb.storage.from('media').getPublicUrl(path);
              if (data && data.publicUrl) return data.publicUrl;
            }
          } catch {}
        }
        return dataUrl;
      }

      function parseOptsText(txt) {
        return String(txt || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          const [name, pr] = l.split(':');
          return { name: (name || '').trim(), price: Number((pr || '0').trim()) || 0 };
        }).filter(x => x.name);
      }
      function formatOptsText(opts) {
        return (Array.isArray(opts) ? opts : []).map(o => o.name + ':' + (o.price || 0)).join('\n');
      }

      const STATUS_FLOW = {
        new:       { label:'Täze sargyt',  cls:'st-new',       next:'accepted',  nextLabel:'✓ Kabul et' },
        accepted:  { label:'Kabul edildi', cls:'st-accepted',  next:'preparing', nextLabel:'🔥 Taýýarlap başla' },
        preparing: { label:'Taýýarlanýar', cls:'st-preparing', next:'onway',     nextLabel:'🛵 Kurýere ber' },
        onway:     { label:'Kurýer ýolda', cls:'st-onway',     next:'delivered', nextLabel:'✅ Eltildi' },
        delivered: { label:'Eltildi ✓',    cls:'st-delivered', next:null },
        cancelled: { label:'Ýatyryldy',    cls:'st-cancelled', next:null }
      };

      const state = {
        session: loadJSON(SESSION_KEY, null),
        tab: 'orders', // 'orders' | 'products' | 'analytics' | 'coupons' | 'reviews' | 'settings'
        orderFilter: 'active',
        reportRange: 'week', // 'today' | 'week' | 'month'
        stores: loadJSON(DB_STORES_KEY, []),
        products: loadJSON(DB_PRODUCTS_KEY, []),
        orders: loadJSON(DB_ORDERS_KEY, []),
        coupons: loadJSON(DB_COUPONS_KEY, []),
        reviews: loadJSON(DB_REVIEWS_KEY, []),
        hasAlarm: false,
        newProdImg: '', editProdImg: '', setLogoImg: '', setCoverImg: ''
      };

      function currentStore() {
        if (!state.session) return null;
        return state.stores.find(s => s.id === state.session.storeId) || {
          id:state.session.storeId, name:state.session.name || state.session.storeId, emoji:'🏪', isOpen:true,
          hours:'09:00–22:00', eta:'30–45 min', minOrder:0, deliveryFee:0, freeDeliveryOver:100
        };
      }
      function myOrders() { return state.session ? state.orders.filter(o => o.storeId === state.session.storeId) : []; }
      function myProducts() { return state.session ? state.products.filter(p => p.storeId === state.session.storeId) : []; }
      function myCoupons() { return state.session ? state.coupons.filter(c => c.storeId === state.session.storeId) : []; }
      function myReviews() { return state.session ? state.reviews.filter(r => r.storeId === state.session.storeId) : []; }

      function getClientSiteUrl() { return (CONFIG.CLIENT_SITE_URL || localStorage.getItem(CLIENT_URL_KEY) || '').trim(); }
      function openClientSite() {
        const u = getClientSiteUrl();
        if (u) { window.open(u, '_blank', 'noopener'); return; }
        if (/dukan/i.test(window.location.pathname)) { window.open('index-v4.html', '_blank', 'noopener'); return; }
        document.getElementById('clientUrlInput').value = '';
        document.getElementById('siteUrlModal').classList.add('open');
      }

      // ===== SUPABASE SYNC + REALTIME ALARM =====
      function mapOrderFromSb(r) {
        return {
          code:r.code, storeId:r.store_id, storeName:r.store_name, status:r.status,
          createdAt:new Date(r.created_at).getTime(), customerName:r.customer_name,
          customerPhone:r.customer_phone, address:r.address, note:r.note, pay:r.pay_method,
          deliveryTime:r.delivery_time || 'Tiz', lat:r.lat, lng:r.lng,
          couponCode:r.coupon_code, discount:Number(r.discount || 0), deliveryFee:Number(r.delivery_fee || 0),
          cancelReason:r.cancel_reason || '', items:r.items || [], total:Number(r.total), count:Number(r.count)
        };
      }

      async function syncSupabaseStore() {
        if (!sb || !state.session) return;
        const sid = state.session.storeId;
        const [oRes, pRes, sRes, cRes, rRes] = await Promise.all([
          sb.from('orders').select('*').eq('store_id', sid).order('created_at', { ascending:false }),
          sb.from('products').select('*').eq('store_id', sid),
          sb.from('stores').select('*').eq('id', sid),
          sb.from('coupons').select('*').eq('store_id', sid),
          sb.from('reviews').select('*').eq('store_id', sid).order('created_at', { ascending:false })
        ]);
        if (oRes.data) state.orders = oRes.data.map(mapOrderFromSb);
        if (pRes.data) state.products = pRes.data.map(r => ({ id:r.id, storeId:r.store_id, cat:r.cat||'Esasy', title:r.title, unit:r.unit||'1 sany', price:Number(r.price), oldPrice:r.old_price?Number(r.old_price):null, emoji:r.emoji||'📦', deal:!!r.deal, inStock:r.in_stock!==false, desc:r.desc||'', imageUrl:r.image_url||'', options:Array.isArray(r.options)?r.options:[] }));
        if (sRes.data) state.stores = sRes.data.map(r => ({ id:r.id, name:r.name, emoji:r.emoji||'🏪', desc:r.desc||'', eta:r.eta||'30–45 min', hours:r.hours||'09:00–22:00', isOpen:r.is_open!==false, phone:r.phone||'', logoUrl:r.logo_url||'', coverUrl:r.cover_url||'', minOrder:Number(r.min_order||0), deliveryFee:Number(r.delivery_fee||0), freeDeliveryOver:Number(r.free_delivery_over||0) }));
        if (cRes.data) state.coupons = cRes.data.map(r => ({ id:r.id, storeId:r.store_id, code:r.code, percent:Number(r.percent), minOrder:Number(r.min_order||0), active:r.active }));
        if (rRes.data) state.reviews = rRes.data.map(r => ({ id:r.id, orderCode:r.order_code, storeId:r.store_id, customerName:r.customer_name, rating:r.rating, comment:r.comment, reply:r.reply||'', createdAt:new Date(r.created_at).getTime() }));
        render();
      }

      let rtChannel = null;
      function startRealtime() {
        if (!sb || !state.session) return;
        if (rtChannel) sb.removeChannel(rtChannel);
        const sid = state.session.storeId;
        rtChannel = sb.channel('store-' + sid)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders', filter: 'store_id=eq.' + sid }, payload => {
            const o = mapOrderFromSb(payload.new);
            state.orders.unshift(o);
            state.hasAlarm = true;
            playAlarm();
            toast('🔔 TÄZE SARGYT GELDI: ' + o.code);
            render();
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: 'store_id=eq.' + sid }, () => syncSupabaseStore())
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'reviews', filter: 'store_id=eq.' + sid }, () => { toast('⭐ Täze teswir geldi!'); syncSupabaseStore(); })
          .subscribe();
      }

      window.addEventListener('storage', e => {
        if (e.key === DB_ORDERS_KEY && state.session) {
          const prev = myOrders().length;
          state.orders = loadJSON(DB_ORDERS_KEY, []);
          if (myOrders().length > prev) { state.hasAlarm = true; playAlarm(); toast('🔔 TÄZE SARGYT GELDI!'); }
          render();
        }
      });

      // ===== RECEIPT PRINT & COURIER SHARE =====
      function printReceipt(code) {
        const o = myOrders().find(x => x.code === code); if (!o) return;
        const s = currentStore();
        const w = window.open('', '_blank', 'width=340,height=560');
        w.document.write('<html><head><title>Çek ' + o.code + '</title><style>body{font-family:monospace;font-size:12px;width:280px;margin:10px auto;color:#000}h2,p{margin:3px 0;text-align:center}.line{border-top:1px dashed #000;margin:8px 0}.row{display:flex;justify-content:space-between;margin:3px 0}</style></head><body>' +
          '<h2>' + esc(s.name) + '</h2><p>ŞäherMarket Sargyt Çeki</p><div class="line"></div>' +
          '<div>Kod: <b>' + esc(o.code) + '</b></div><div>Sene: ' + new Date(o.createdAt).toLocaleString('tr-TR') + '</div>' +
          '<div>Müşderi: ' + esc(o.customerName) + '</div><div>Tel: ' + esc(o.customerPhone) + '</div><div>Salgy: ' + esc(o.address) + '</div>' +

          o.items.map(it => '<div class="row"><span>' + it.qty + 'x ' + esc(it.title) + '</span><span>' + (it.price * it.qty) + ' m.</span></div>').join('') +
          '<div class="line"></div>' +
          (o.discount ? '<div class="row"><span>Arzanladyş:</span><span>-' + o.discount + ' m.</span></div>' : '') +
          '<div class="row"><span>Eltip bermek:</span><span>' + (o.deliveryFee || 0) + ' m.</span></div>' +
          '<div class="row" style="font-size:15px;font-weight:bold;"><span>JEMI:</span><span>' + o.total + ' m.</span></div>' +
          '<p style="margin-top:10px;">Töleg: ' + (o.pay === 'card' ? 'KART' : 'NAGT') + '</p>' +
          '<script>window.print();</' + 'script></body></html>');
        w.document.close();
      }

      function shareToCourier(code) {
        const o = myOrders().find(x => x.code === code); if (!o) return;
        const mapUrl = (o.lat && o.lng) ? ('https://maps.google.com/?q=' + o.lat + ',' + o.lng) : ('https://maps.google.com/?q=' + encodeURIComponent(o.address));
        const msg = '🛵 KURÝER SARGYT: ' + o.code + '\nDükan: ' + currentStore().name + '\nMüşderi: ' + o.customerName + ' (' + o.customerPhone + ')\nSalgy: ' + o.address + '\nKarta: ' + mapUrl + '\nTöleg: ' + o.total + ' m. (' + (o.pay === 'card' ? 'Kart' : 'Nagt') + ')';
        if (navigator.share) navigator.share({ text: msg }).catch(() => {});
        else window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
      }

      // ===== CSV EXPORT =====
      function exportCsv() {
        const rows = [['Kod','Sene','Müşderi','Telefon','Salgy','Ýagdaý','Töleg','Jemi (m.)']];
        myOrders().forEach(o => rows.push([o.code, new Date(o.createdAt).toLocaleString('tr-TR'), o.customerName, o.customerPhone, o.address, o.status, o.pay, o.total]));
        const csv = rows.map(r => r.map(v => '"' + String(v || '').replace(/"/g, '""') + '"').join(',')).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = 'sargytlar_' + state.session.storeId + '.csv';
        a.click();
        toast('Excel/CSV ýüklendi ✓');
      }

      // ===== ACTIONS =====
      async function handleLogin(email, pass) {
        const clean = email.trim().toLowerCase();
        if (sb) {
          const { error } = await sb.auth.signInWithPassword({ email: clean, password: pass });
          if (error) return 'E-poçta ýa-da parol nädogry.';
          const { data: st } = await sb.from('stores').select('*').eq('owner_email', clean).single();
          if (!st) return 'Bu hasaba bagly dükan tapylmady.';
          state.session = { email: clean, storeId: st.id, name: st.name };
          saveJSON(SESSION_KEY, state.session);
          await syncSupabaseStore(); startRealtime(); render(); return null;
        }
        const acc = STORE_ACCOUNTS.find(a => a.email === clean && a.pass === pass);
        if (!acc) return 'E-poçta ýa-da parol nädogry. (Parol: 123456)';
        state.session = { email: acc.email, storeId: acc.storeId, name: acc.name };
        saveJSON(SESSION_KEY, state.session); render(); return null;
      }

      async function updateOrderStatus(code, newStatus, cancelReason) {
        const idx = state.orders.findIndex(o => o.code === code && o.storeId === state.session.storeId);
        if (idx === -1) return;
        state.orders[idx].status = newStatus;
        if (cancelReason) state.orders[idx].cancelReason = cancelReason;
        state.hasAlarm = false;
        saveJSON(DB_ORDERS_KEY, state.orders);
        if (sb) {
          const upd = { status: newStatus };
          if (cancelReason) upd.cancel_reason = cancelReason;
          await sb.from('orders').update(upd).eq('code', code).eq('store_id', state.session.storeId);
        }
        toast('Sargyt täzelendi ✓'); render();
      }

      async function bulkPriceChange(percent) {
        if (!confirm('Ähli harytlaryň bahasyny ' + (percent > 0 ? '+' : '') + percent + '% üýtgetmek isleýärsiňizmi?')) return;
        const mult = 1 + (percent / 100);
        const mine = myProducts();
        for (const p of mine) {
          p.price = Math.max(1, Math.round(p.price * mult));
          if (sb) await sb.from('products').update({ price: p.price }).eq('id', p.id).eq('store_id', state.session.storeId);
        }
        saveJSON(DB_PRODUCTS_KEY, state.products);
        toast('Ähli bahalar täzelendi ✓'); render();
      }

        return '<div class="login-wrap"><div class="login-card"><div class="logo-badge">Ş</div><h1>Dükan Paneli PRO</h1><p>Öz dükanyňyzy dolandyrmak üçin e-poçta we parol bilen giriň.</p>' +

          STORE_ACCOUNTS.map(a => '<button type="button" class="demo-acc" data-fill-email="' + a.email + '" data-fill-pass="' + a.pass + '"><strong>' + esc(a.name) + '</strong><span>' + a.email + '</span></button>').join('') +
          '</div></div></div></div>';
      }

      function renderAnalytics(orders) {
        const now = Date.now();
        const ms = state.reportRange === 'today' ? 86400000 : (state.reportRange === 'week' ? 7 * 86400000 : 30 * 86400000);
        const filtered = orders.filter(o => o.status !== 'cancelled' && (now - o.createdAt) <= ms);
        const rev = filtered.reduce((s, o) => s + Number(o.total || 0), 0);
        const avg = filtered.length ? Math.round(rev / filtered.length) : 0;

        // 7-day chart
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(now - i * 86400000);
          const key = d.toISOString().slice(0, 10);
          const sum = orders.filter(o => o.status !== 'cancelled' && new Date(o.createdAt).toISOString().slice(0, 10) === key).reduce((a, o) => a + Number(o.total || 0), 0);
          days.push({ lbl: d.getDate() + '.' + (d.getMonth() + 1), sum });
        }
        const maxSum = Math.max(1, ...days.map(x => x.sum));

        // Top 5 products
        const prodMap = {};
        filtered.forEach(o => (o.items || []).forEach(it => { prodMap[it.title] = (prodMap[it.title] || 0) + Number(it.qty || 1); }));
        const top5 = Object.entries(prodMap).sort((a, b) => b[1] - a[1]).slice(0, 5);

        return '<div class="filter-row">' +
            '<button type="button" class="f-chip' + (state.reportRange === 'today' ? ' active' : '') + '" data-rr="today">Şu gün</button>' +
            '<button type="button" class="f-chip' + (state.reportRange === 'week' ? ' active' : '') + '" data-rr="week">Soňky 7 gün</button>' +
            '<button type="button" class="f-chip' + (state.reportRange === 'month' ? ' active' : '') + '" data-rr="month">Soňky 30 gün</button>' +
            '<button type="button" class="f-chip" id="exportCsvBtn" style="margin-left:auto;background:rgba(16,185,129,.2);color:#34d399;border-color:rgba(16,185,129,.4);">📥 Excel / CSV</button>' +
          '</div>' +
          '<div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">' +
            '<div class="stat-card"><div class="stat-lbl">Girdeji</div><div class="stat-val green">' + fmt(rev) + '</div></div>' +
            '<div class="stat-card"><div class="stat-lbl">Sargyt sany</div><div class="stat-val">' + filtered.length + '</div></div>' +
            '<div class="stat-card"><div class="stat-lbl">Ortaça sebet</div><div class="stat-val orange">' + fmt(avg) + '</div></div>' +
          '</div>' +
          '<div class="panel-box"><h3 style="font-size:14.5px;font-weight:800;">📈 Soňky 7 günüň girdejisi</h3><div class="chart-bars">' +
            days.map(d => '<div class="bar-col"><span class="bar-val">' + (d.sum ? d.sum : '') + '</span><div class="bar-fill" style="height:' + Math.max(4, Math.round((d.sum / maxSum) * 90)) + 'px;"></div><span class="bar-lbl">' + d.lbl + '</span></div>').join('') +
          '</div></div>' +
          '<div class="panel-box"><h3 style="font-size:14.5px;font-weight:800;margin-bottom:10px;">🏆 Iň köp satylan 5 haryt</h3>' +
            (top5.length ? top5.map((x, i) => '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);"><span>' + (i + 1) + '. <strong>' + esc(x[0]) + '</strong></span><span style="color:#34d399;font-weight:800;">' + x[1] + ' sany</span></div>').join('') : '<div style="color:var(--sub);font-size:12.5px;">Bu aralykda entek satuw ýok.</div>') +
          '</div>';
      }

              '<button type="submit" class="btn-primary">Harydy goş</button></form>' +
            '<div class="prod-manage-grid">' + products.map(p =>
              '<div class="pm-card"><div class="pm-top"><div class="pm-thumb">' + (p.imageUrl ? '<img src="' + esc(p.imageUrl) + '" />' : (p.emoji || '📦')) + '</div><div style="flex:1;min-width:0;"><div style="font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(p.title) + '</div><div style="font-size:11.5px;color:var(--sub);">' + esc(p.unit) + ' • <strong style="color:#fff;">' + fmt(p.price) + '</strong></div></div></div>' +
              '<div class="pm-actions"><button type="button" class="pm-btn ' + (p.inStock !== false ? 'in' : 'out') + '" data-stock="' + esc(p.id) + '">' + (p.inStock !== false ? 'Bar ✓' : 'Gutardy') + '</button><button type="button" class="pm-btn edit" data-edit="' + esc(p.id) + '">✏️ Üýtget</button><button type="button" class="pm-btn del" data-del="' + esc(p.id) + '">🗑️ Poz</button></div></div>'
            ).join('') + '</div>';
        } else if (state.tab === 'analytics') {
          content = renderAnalytics(orders);
        } else if (state.tab === 'coupons') {
          content = '<form id="addCouponForm" class="panel-box"><h3 style="font-size:15px;font-weight:800;">🎟️ Täze kupon döret</h3>' +
              '<div class="form-row-3"><div class="field"><label>Kupon kody *</label><input id="cpCode" required placeholder="ALTYN15" style="text-transform:uppercase;" /></div><div class="field"><label>Arzanladyş (%)</label><input id="cpPct" type="number" min="1" max="90" value="15" required /></div><div class="field"><label>Min. sebet (m.)</label><input id="cpMin" type="number" min="0" value="40" /></div></div>' +
              '<button type="submit" class="btn-primary">Kupon goş ✓</button></form>' +
            (coupons.length ? coupons.map(c => '<div class="panel-box" style="display:flex;align-items:center;justify-content:space-between;padding:12px 15px;"><div><strong style="font-size:15px;color:#34d399;">' + esc(c.code) + ' (-' + c.percent + '%)</strong><div style="font-size:11.5px;color:var(--sub);">Min: ' + fmt(c.minOrder) + '</div></div><button type="button" class="pm-btn del" style="padding:0 12px;" data-del-cp="' + c.id + '">Poz</button></div>').join('') : '<div class="empty">Entek dükan kuponyňyz ýok.</div>');
        } else if (state.tab === 'reviews') {
          content = reviews.length ? reviews.map(r =>
            '<div class="panel-box"><div style="display:flex;justify-content:space-between;"><strong>' + esc(r.customerName) + '</strong><span>' + '⭐'.repeat(r.rating) + '</span></div><p style="font-size:13px;margin:6px 0;">' + esc(r.comment || 'Teswir ýazylmady') + '</p>' +
            (r.reply ? '<div style="background:rgba(16,185,129,.12);padding:8px 10px;border-radius:10px;font-size:12px;color:#6ee7b7;">Jogabyňyz: ' + esc(r.reply) + '</div>' : '<div style="display:flex;gap:7px;margin-top:8px;"><input id="rep_' + r.id + '" class="url-small" style="margin:0;" placeholder="Müşderä jogap ýazyň..." /><button type="button" class="pm-btn in" style="padding:0 14px;" data-reply-id="' + r.id + '">Iber</button></div>') + '</div>'
          ).join('') : '<div class="empty">⭐ Entek müşderi teswiri ýok.</div>';
        } else if (state.tab === 'settings') {
          content = '<form id="settingsForm" class="panel-box"><h3 style="font-size:16px;font-weight:800;">⚙️ Dükan, Logo we Eltip Bermek</h3>' +
            '<div class="form-row">' +
              '<div class="field"><label>Logo</label><div class="upload-box"><div class="upload-preview" id="sLogoPrev">' + (state.setLogoImg ? '<img src="' + esc(state.setLogoImg) + '" />' : (store.emoji || '🏪')) + '</div><div style="flex:1;"><label class="file-lbl">📷 Logo<input type="file" accept="image/*" id="sLogoFile" /></label><input class="url-small" id="sLogoUrl" placeholder="URL..." /></div></div></div>' +
              '<div class="field"><label>Kapak Suraty</label><div class="upload-box"><div class="upload-preview wide" id="sCoverPrev">' + (state.setCoverImg ? '<img src="' + esc(state.setCoverImg) + '" />' : '🖼️') + '</div><div style="flex:1;"><label class="file-lbl">🖼️ Banner<input type="file" accept="image/*" id="sCoverFile" /></label><input class="url-small" id="sCoverUrl" placeholder="URL..." /></div></div></div>' +
            '</div>' +
            '<div class="form-row"><div class="field"><label>Dükanyň ady *</label><input id="sName" required value="' + esc(store.name) + '" /></div><div class="field"><label>Telefon</label><input id="sPhone" value="' + esc(store.phone || '') + '" /></div></div>' +
            '<div class="field"><label>Düşündiriş</label><input id="sDesc" value="' + esc(store.desc || '') + '" /></div>' +
            '<div class="form-row"><div class="field"><label>Iş sagatlary</label><input id="sHours" value="' + esc(store.hours || '09:00–22:00') + '" /></div><div class="field"><label>Eltip bermek wagty</label><input id="sEta" value="' + esc(store.eta || '30–45 min') + '" /></div></div>' +
            '<div class="form-row-3"><div class="field"><label>Min. sebet (m.)</label><input id="sMin" type="number" min="0" value="' + (store.minOrder || 0) + '" /></div><div class="field"><label>Eltip bermek (m.)</label><input id="sDel" type="number" min="0" value="' + (store.deliveryFee || 0) + '" /></div><div class="field"><label>Mugt çäk (m.+)</label><input id="sFree" type="number" min="0" value="' + (store.freeDeliveryOver || 0) + '" /></div></div>' +
            '<div class="field"><label>Müşderi saýtynyň salgysy</label><input id="sClientUrl" type="url" value="' + esc(getClientSiteUrl()) + '" placeholder="https://..." /></div>' +
            '<button type="submit" class="btn-primary">Ýatda sakla ✓</button></form>';
        }

        return '<div class="dash-shell">' +
          '<div class="alarm-banner' + (state.hasAlarm ? ' show' : '') + '"><span>🔔 TÄZE SARGYT GELDI!</span><button type="button" id="dismissAlarmBtn" style="border:none;background:#fff;color:#0b1120;padding:5px 12px;border-radius:9px;font-weight:800;cursor:pointer;">Gördüm ✓</button></div>' +
          '<div class="dash-top">' +
            '<div class="store-id-wrap"><div class="store-avatar">' + (store.logoUrl ? '<img src="' + esc(store.logoUrl) + '" />' : (store.emoji || '🏪')) + '</div><div><strong style="font-size:18px;">' + esc(store.name) + '</strong><div style="font-size:11.5px;color:var(--sub);">' + esc(state.session.email) + ' • ● Realtime işjeň</div></div></div>' +
            '<div class="top-actions"><button type="button" class="status-toggle ' + (store.isOpen !== false ? 'open' : 'closed') + '" id="toggleOpenBtn">' + (store.isOpen !== false ? '● Açyk' : '● Ýapyk') + '</button><button type="button" class="top-btn" id="viewSiteBtn">🌐 Saýty gör</button><button type="button" class="top-btn" id="logoutBtn">Çykyş</button></div>' +
          '</div>' +
          '<div class="stats-grid">' +
            '<div class="stat-card"><div class="stat-lbl">Täze sargyt</div><div class="stat-val orange">' + newCount + '</div></div>' +
            '<div class="stat-card"><div class="stat-lbl">Şu günki girdeji</div><div class="stat-val green">' + fmt(todayRev) + '</div></div>' +
            '<div class="stat-card"><div class="stat-lbl">Jemi sargyt</div><div class="stat-val">' + orders.length + '</div></div>' +
            '<div class="stat-card"><div class="stat-lbl">Baha</div><div class="stat-val">★ ' + avgRate + '</div></div>' +
          '</div>' +
          '<div class="tabs">' +
            '<button type="button" class="tab-btn' + (state.tab === 'orders' ? ' active' : '') + '" data-tab="orders">📦 Sargytlar <span class="pill-cnt">' + activeOrders.length + '</span></button>' +
            '<button type="button" class="tab-btn' + (state.tab === 'products' ? ' active' : '') + '" data-tab="products">🛍️ Harytlar (' + products.length + ')</button>' +
            '<button type="button" class="tab-btn' + (state.tab === 'analytics' ? ' active' : '') + '" data-tab="analytics">📊 Hasabat</button>' +
            '<button type="button" class="tab-btn' + (state.tab === 'coupons' ? ' active' : '') + '" data-tab="coupons">🎟️ Kupon</button>' +
            '<button type="button" class="tab-btn' + (state.tab === 'reviews' ? ' active' : '') + '" data-tab="reviews">⭐ Teswir (' + reviews.length + ')</button>' +
            '<button type="button" class="tab-btn' + (state.tab === 'settings' ? ' active' : '') + '" data-tab="settings">⚙️ Dükan</button>' +
          '</div>' + content +
        '</div>';
      }

      function render() { document.getElementById('root').innerHTML = state.session ? renderDashboard() : renderLogin(); }

      // Edit Modal
      document.getElementById('closeEditModal').addEventListener('click', () => document.getElementById('editModal').classList.remove('open'));
      document.getElementById('eImgFile').addEventListener('change', async e => { if (e.target.files[0]) { state.editProdImg = await uploadImageSmart(e.target.files[0], 560); document.getElementById('eImgPrev').innerHTML = '<img src="' + state.editProdImg + '" />'; } });
      document.getElementById('eImgUrl').addEventListener('input', e => { state.editProdImg = e.target.value.trim(); document.getElementById('eImgPrev').innerHTML = state.editProdImg ? '<img src="' + esc(state.editProdImg) + '" />' : '📦'; });
      document.getElementById('eImgClear').addEventListener('click', () => { state.editProdImg = ''; document.getElementById('eImgUrl').value = ''; document.getElementById('eImgPrev').textContent = '📦'; });
      document.getElementById('editProdForm').addEventListener('submit', async e => {
        e.preventDefault();
        const pid = document.getElementById('eId').value;
        const idx = state.products.findIndex(x => x.id === pid && x.storeId === state.session.storeId); if (idx === -1) return;
        const oldP = document.getElementById('eOldPrice').value ? Number(document.getElementById('eOldPrice').value) : null;
        const price = Number(document.getElementById('ePrice').value);
        const upd = {
          ...state.products[idx], title:document.getElementById('eTitle').value.trim(), price, oldPrice:oldP, deal:!!(oldP && oldP > price),
          unit:document.getElementById('eUnit').value.trim(), cat:document.getElementById('eCat').value.trim(),
          emoji:document.getElementById('eEmoji').value.trim(), desc:document.getElementById('eDesc').value.trim(),
          options:parseOptsText(document.getElementById('eOpts').value), imageUrl:state.editProdImg
        };
        state.products[idx] = upd; saveJSON(DB_PRODUCTS_KEY, state.products);
        if (sb) await sb.from('products').update({ title:upd.title, price:upd.price, old_price:upd.oldPrice, deal:upd.deal, unit:upd.unit, cat:upd.cat, emoji:upd.emoji, desc:upd.desc, options:upd.options, image_url:upd.imageUrl }).eq('id', pid).eq('store_id', state.session.storeId);
        document.getElementById('editModal').classList.remove('open'); toast('Haryt täzelendi ✓'); render();
      });

      // Cancel Modal
      document.getElementById('closeCancelModal').addEventListener('click', () => document.getElementById('cancelModal').classList.remove('open'));
      document.getElementById('confirmCancelBtn').addEventListener('click', async () => {
        await updateOrderStatus(document.getElementById('cancelOrderCode').value, 'cancelled', document.getElementById('cancelReasonSel').value);
        document.getElementById('cancelModal').classList.remove('open');
      });

      // Site URL Modal
      document.getElementById('closeSiteUrlModal').addEventListener('click', () => document.getElementById('siteUrlModal').classList.remove('open'));
      document.getElementById('saveClientUrlBtn').addEventListener('click', () => {
        let u = document.getElementById('clientUrlInput').value.trim(); if (!u) return;
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        localStorage.setItem(CLIENT_URL_KEY, u); document.getElementById('siteUrlModal').classList.remove('open'); window.open(u, '_blank', 'noopener');
      });

      // Root Listeners
      document.getElementById('root').addEventListener('change', async e => {
        if (e.target.id === 'pImgFile' && e.target.files[0]) { state.newProdImg = await uploadImageSmart(e.target.files[0], 560); document.getElementById('newProdPrev').innerHTML = '<img src="' + state.newProdImg + '" />'; }
        else if (e.target.id === 'sLogoFile' && e.target.files[0]) { state.setLogoImg = await uploadImageSmart(e.target.files[0], 400); document.getElementById('sLogoPrev').innerHTML = '<img src="' + state.setLogoImg + '" />'; }
        else if (e.target.id === 'sCoverFile' && e.target.files[0]) { state.setCoverImg = await uploadImageSmart(e.target.files[0], 850); document.getElementById('sCoverPrev').innerHTML = '<img src="' + state.setCoverImg + '" />'; }
      });

      document.getElementById('root').addEventListener('submit', async e => {
        e.preventDefault();
        if (e.target.id === 'loginForm') {
          const err = await handleLogin(document.getElementById('lEmail').value, document.getElementById('lPass').value);
          if (err) { const b = document.getElementById('loginErr'); b.textContent = err; b.classList.add('show'); }
        } else if (e.target.id === 'addProdForm') {
          const price = Number(document.getElementById('pPrice').value);
          const oldP = document.getElementById('pOldPrice').value ? Number(document.getElementById('pOldPrice').value) : null;
          const p = { id:'p_' + Date.now(), storeId:state.session.storeId, title:document.getElementById('pTitle').value.trim(), price, oldPrice:oldP, deal:!!(oldP && oldP > price), unit:document.getElementById('pUnit').value.trim() || '1 sany', cat:'Esasy', emoji:document.getElementById('pEmoji').value.trim() || '📦', options:parseOptsText(document.getElementById('pOpts').value), imageUrl:state.newProdImg || document.getElementById('pImgUrl').value.trim(), inStock:true };
          state.products.unshift(p); saveJSON(DB_PRODUCTS_KEY, state.products);
          if (sb) await sb.from('products').insert([{ id:p.id, store_id:p.storeId, title:p.title, price:p.price, old_price:p.oldPrice, deal:p.deal, unit:p.unit, cat:p.cat, emoji:p.emoji, options:p.options, image_url:p.imageUrl, in_stock:true }]);
          state.newProdImg = ''; toast('Haryt goşuldy ✓'); render();
        } else if (e.target.id === 'addCouponForm') {
          const c = { id:Date.now(), storeId:state.session.storeId, code:document.getElementById('cpCode').value.trim().toUpperCase(), percent:Number(document.getElementById('cpPct').value), minOrder:Number(document.getElementById('cpMin').value || 0), active:true };
          state.coupons.unshift(c); saveJSON(DB_COUPONS_KEY, state.coupons);
          if (sb) await sb.from('coupons').insert([{ store_id:c.storeId, code:c.code, percent:c.percent, min_order:c.minOrder, active:true }]);
          toast('Kupon goşuldy ✓'); render();
        } else if (e.target.id === 'settingsForm') {
          let idx = state.stores.findIndex(s => s.id === state.session.storeId);
          if (idx === -1) { state.stores.push({ id:state.session.storeId, isOpen:true }); idx = state.stores.length - 1; }
          const logo = state.setLogoImg || document.getElementById('sLogoUrl').value.trim();
          const cover = state.setCoverImg || document.getElementById('sCoverUrl').value.trim();
          const upd = { ...state.stores[idx], name:document.getElementById('sName').value.trim(), phone:document.getElementById('sPhone').value.trim(), desc:document.getElementById('sDesc').value.trim(), hours:document.getElementById('sHours').value.trim(), eta:document.getElementById('sEta').value.trim(), minOrder:Number(document.getElementById('sMin').value||0), deliveryFee:Number(document.getElementById('sDel').value||0), freeDeliveryOver:Number(document.getElementById('sFree').value||0), logoUrl:logo, coverUrl:cover };
          state.stores[idx] = upd; saveJSON(DB_STORES_KEY, state.stores);
          localStorage.setItem(CLIENT_URL_KEY, document.getElementById('sClientUrl').value.trim());
          if (sb) await sb.from('stores').update({ name:upd.name, phone:upd.phone, desc:upd.desc, hours:upd.hours, eta:upd.eta, min_order:upd.minOrder, delivery_fee:upd.deliveryFee, free_delivery_over:upd.freeDeliveryOver, logo_url:upd.logoUrl, cover_url:upd.coverUrl }).eq('id', state.session.storeId);
          toast('Sazlamalar saklandy ✓'); render();
        }
      });

      document.getElementById('root').addEventListener('click', async e => {
        const el = sel => e.target.closest(sel);
        if (el('[data-fill-email]')) { document.getElementById('lEmail').value = el('[data-fill-email]').getAttribute('data-fill-email'); document.getElementById('lPass').value = el('[data-fill-pass]').getAttribute('data-fill-pass'); return; }
        if (el('#dismissAlarmBtn')) { state.hasAlarm = false; render(); return; }
        if (el('#viewSiteBtn')) { openClientSite(); return; }
        if (el('#logoutBtn')) { state.session = null; localStorage.removeItem(SESSION_KEY); if (sb) sb.auth.signOut(); render(); return; }
        if (el('#toggleOpenBtn')) {
          const idx = state.stores.findIndex(s => s.id === state.session.storeId);
          if (idx >= 0) { state.stores[idx].isOpen = state.stores[idx].isOpen === false ? true : false; saveJSON(DB_STORES_KEY, state.stores); if (sb) await sb.from('stores').update({ is_open: state.stores[idx].isOpen }).eq('id', state.session.storeId); render(); }
          return;
        }
        if (el('[data-tab]')) {
          state.tab = el('[data-tab]').getAttribute('data-tab');
          if (state.tab === 'settings') { const st = currentStore(); state.setLogoImg = st.logoUrl || ''; state.setCoverImg = st.coverUrl || ''; }
          render(); return;
        }
        if (el('[data-of]')) { state.orderFilter = el('[data-of]').getAttribute('data-of'); render(); return; }
        if (el('[data-rr]')) { state.reportRange = el('[data-rr]').getAttribute('data-rr'); render(); return; }
        if (el('#exportCsvBtn')) { exportCsv(); return; }
        if (el('[data-next-code]')) { const b = el('[data-next-code]'); updateOrderStatus(b.getAttribute('data-next-code'), b.getAttribute('data-next-st')); return; }
        if (el('[data-print]')) { printReceipt(el('[data-print]').getAttribute('data-print')); return; }
        if (el('[data-courier]')) { shareToCourier(el('[data-courier]').getAttribute('data-courier')); return; }
        if (el('[data-open-cancel]')) { document.getElementById('cancelOrderCode').value = el('[data-open-cancel]').getAttribute('data-open-cancel'); document.getElementById('cancelModal').classList.add('open'); return; }
        if (el('[data-bulk]')) { bulkPriceChange(Number(el('[data-bulk]').getAttribute('data-bulk'))); return; }
        if (el('[data-stock]')) {
          const pid = el('[data-stock]').getAttribute('data-stock');
          const idx = state.products.findIndex(p => p.id === pid && p.storeId === state.session.storeId);
          if (idx >= 0) { state.products[idx].inStock = state.products[idx].inStock === false ? true : false; saveJSON(DB_PRODUCTS_KEY, state.products); if (sb) await sb.from('products').update({ in_stock: state.products[idx].inStock }).eq('id', pid); render(); }
          return;
        }
        if (el('[data-edit]')) {
          const p = myProducts().find(x => x.id === el('[data-edit]').getAttribute('data-edit')); if (!p) return;
          state.editProdImg = p.imageUrl || '';
          document.getElementById('eId').value = p.id; document.getElementById('eTitle').value = p.title;
          document.getElementById('ePrice').value = p.price; document.getElementById('eOldPrice').value = p.oldPrice || '';
          document.getElementById('eUnit').value = p.unit || ''; document.getElementById('eCat').value = p.cat || '';
          document.getElementById('eEmoji').value = p.emoji || '📦'; document.getElementById('eDesc').value = p.desc || '';
          document.getElementById('eOpts').value = formatOptsText(p.options);
          document.getElementById('eImgPrev').innerHTML = state.editProdImg ? '<img src="' + esc(state.editProdImg) + '" />' : (p.emoji || '📦');
          document.getElementById('editModal').classList.add('open'); return;
        }
        if (el('[data-del]')) {
          const pid = el('[data-del]').getAttribute('data-del');
          if (confirm('Bu harydy pozmak isleýärsiňizmi?')) { state.products = state.products.filter(x => x.id !== pid); saveJSON(DB_PRODUCTS_KEY, state.products); if (sb) await sb.from('products').delete().eq('id', pid); toast('Pozuldy 🗑️'); render(); }
          return;
        }
        if (el('[data-del-cp]')) {
          const cid = el('[data-del-cp]').getAttribute('data-del-cp');
          state.coupons = state.coupons.filter(x => String(x.id) !== String(cid)); saveJSON(DB_COUPONS_KEY, state.coupons);
          if (sb) await sb.from('coupons').delete().eq('id', cid);
          toast('Kupon pozuldy'); render(); return;
        }
        if (el('[data-reply-id]')) {
          const rid = el('[data-reply-id]').getAttribute('data-reply-id');
          const txt = document.getElementById('rep_' + rid).value.trim(); if (!txt) return;
          const idx = state.reviews.findIndex(x => String(x.id) === String(rid));
          if (idx >= 0) { state.reviews[idx].reply = txt; saveJSON(DB_REVIEWS_KEY, state.reviews); if (sb) await sb.from('reviews').update({ reply: txt }).eq('id', rid); toast('Jogap iberildi ✓'); render(); }
          return;
        }
        if (el('#pImgClear')) { state.newProdImg = ''; render(); return; }
      });

      render();
      if (state.session) { syncSupabaseStore(); startRealtime(); }
    })();
  </script>
</body>
</html>
