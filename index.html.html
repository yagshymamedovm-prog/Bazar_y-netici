<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060a13" />
  <title>ŞäherMarket Studio ULTRA — Doly Dükan Ulgamy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#060a13;--sidebar:#0a101f;--surface:#0f172a;--card:#121c30;--card-hover:#17243d;--soft:#1b2842;--input:#090f1d;--ink:#f8fafc;--ink2:#cbd5e1;--sub:#8494ad;--muted:#56657e;--border:rgba(148,163,184,.12);--border-hi:rgba(148,163,184,.25);--accent:#10b981;--blue:#3b82f6;--violet:#8b5cf6;--orange:#f97316;--danger:#ef4444;--grad:linear-gradient(135deg,#10b981 0%,#0d9488 55%,#0284c7 100%);--grad-warm:linear-gradient(135deg,#f97316,#ec4899);--side-w:258px;--top-h:66px;--r:16px}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,sans-serif;font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
    button,input,textarea,select{font-family:inherit;color:inherit}
    ::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:999px}
    .net-banner{display:none;position:sticky;top:0;z-index:120;padding:10px 20px;background:linear-gradient(90deg,#dc2626,#ea580c);color:#fff;font-weight:800;font-size:13px;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 24px rgba(220,38,38,.45)}
    .net-banner.offline{display:flex}.net-banner.pending{display:flex;background:linear-gradient(90deg,#d97706,#0284c7)}
    .login-screen{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;background:var(--bg)}
    .login-visual{padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 20% 20%,rgba(16,185,129,.22),transparent 48%),radial-gradient(circle at 80% 80%,rgba(59,130,246,.22),transparent 50%),linear-gradient(160deg,#091020 0%,#060a13 100%);border-right:1px solid var(--border)}
    .lv-logo{width:46px;height:46px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
    .lv-hero h1{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1.12;max-width:540px}
    .lv-hero h1 span{background:linear-gradient(90deg,#34d399,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lv-pills{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
    .lv-pill{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;padding:9px 13px;font-size:12px;font-weight:700;color:var(--ink2)}
    .login-panel{display:flex;align-items:center;justify-content:center;padding:34px}.login-box{width:100%;max-width:410px}
    .demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .demo-acc{border:1px solid var(--border);background:var(--card);border-radius:11px;padding:8px 10px;text-align:left;cursor:pointer}.demo-acc:hover{border-color:var(--accent)}
    .app-layout{display:flex;min-height:100vh}
    .sidebar{width:var(--side-w);position:fixed;inset:0 auto 0 0;z-index:40;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .25s}
    .side-head{height:var(--top-h);padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
    .side-logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
    .side-store{margin:12px 10px 4px;padding:10px;border-radius:13px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .side-avatar{width:38px;height:38px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;overflow:hidden;flex-shrink:0}.side-avatar img{width:100%;height:100%;object-fit:cover}
    .live-dot{width:7px;height:7px;border-radius:50%;background:#10b981;display:inline-block;box-shadow:0 0 8px #10b981}.live-dot.red{background:#ef4444;box-shadow:0 0 8px #ef4444}
    .side-nav{flex:1;overflow-y:auto;padding:6px 10px 14px;display:flex;flex-direction:column;gap:2px}
    .nav-group{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;padding:10px 10px 4px}
    .nav-item{width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;text-align:left;transition:.14s}
    .nav-item:hover{background:rgba(255,255,255,.04);color:var(--ink)}
    .nav-item.active{background:linear-gradient(90deg,rgba(16,185,129,.18),rgba(16,185,129,.04));border-color:rgba(16,185,129,.3);color:#fff}
    .nav-item .badge{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--ink2)}.nav-item .badge.hot{background:var(--orange);color:#fff}
    .side-foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
    .side-foot-btn{width:100%;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:8px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer}
    .main-area{flex:1;margin-left:var(--side-w);min-width:0;display:flex;flex-direction:column;background:radial-gradient(circle at 85% 0%,rgba(16,185,129,.07),transparent 42%),var(--bg)}
    .topbar{height:var(--top-h);position:sticky;top:0;z-index:30;padding:0 22px;background:rgba(6,10,19,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .tb-left{display:flex;align-items:center;gap:10px;min-width:0}
    .menu-toggle{display:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card);font-size:17px;cursor:pointer}
    .page-title{font-size:17px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
    .net-pill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
    .net-pill.on{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.35)}.net-pill.off{background:rgba(239,68,68,.22);color:#fca5a5;border:1px solid rgba(239,68,68,.5)}
    .tb-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .pill-btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:7px 11px;font-size:11.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap}
    .pill-btn:hover{border-color:var(--border-hi);background:var(--card-hover)}
    .pill-btn.open{background:rgba(16,185,129,.15);color:#34d399;border-color:rgba(16,185,129,.38)}.pill-btn.closed{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.38)}
    .pill-btn.busy{background:rgba(249,115,22,.18);color:#fdba74;border-color:rgba(249,115,22,.42)}.pill-btn.primary{background:var(--grad);border-color:transparent;color:#fff}
    .content-wrap{padding:20px 22px 60px;max-width:1480px;width:100%;margin:0 auto}
    .alarm-banner{display:none;background:var(--grad-warm);color:#fff;padding:12px 16px;border-radius:14px;margin-bottom:16px;align-items:center;justify-content:space-between;font-weight:800}.alarm-banner.show{display:flex}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
    .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px 17px}
    .kpi-val{font-size:24px;font-weight:800;letter-spacing:-.7px;margin-top:6px}
    .goal-bar{height:7px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:8px}.goal-fill{height:100%;background:var(--grad);border-radius:999px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:17px;margin-bottom:15px}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
    .card-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
    .seg-group{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px}
    .seg-btn{border:none;background:transparent;color:var(--sub);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}.seg-btn.active{background:var(--soft);color:#fff}
    .field{margin-top:10px}.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
    .field input,.field select,.field textarea{width:100%;background:var(--input);border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;font-size:13px;font-weight:600;color:#fff;outline:none}
    .field textarea{resize:vertical;min-height:58px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
    .btn-primary{width:100%;height:42px;margin-top:13px;border:none;border-radius:11px;background:var(--grad);color:#fff;font-size:13px;font-weight:800;cursor:pointer}
    .form-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}.form-4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
    .err-box{display:none;margin-top:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:9px;border-radius:10px;font-size:12px;font-weight:700}.err-box.show{display:block}
    .search-inp{background:var(--input);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12.5px;color:#fff;outline:none;min-width:210px}
    .toggle-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
    .switch{position:relative;width:42px;height:23px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:#334155;border-radius:999px;cursor:pointer;transition:.2s}.slider::before{content:'';position:absolute;width:17px;height:17px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
    .switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider::before{transform:translateX(19px)}
    .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
    .kb-col{background:rgba(15,23,42,.68);border:1.5px solid var(--border);border-radius:16px;padding:11px;min-height:420px;transition:.15s}.kb-col.drag-over{border-color:var(--accent);background:rgba(16,185,129,.08)}
    .kb-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 11px;border-bottom:1px solid var(--border);margin-bottom:11px}
    .order-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;cursor:grab}
    .order-card.is-new{border-color:rgba(16,185,129,.55)}.order-card.is-prio{border-color:#ef4444;box-shadow:0 0 0 1px rgba(239,68,68,.35)}
    .timer-pill{font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;background:rgba(16,185,129,.16);color:#6ee7b7}.timer-pill.warn{background:rgba(245,158,11,.22);color:#fcd34d}.timer-pill.late{background:rgba(239,68,68,.25);color:#fca5a5}
    .oc-cust{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11.5px;display:flex;flex-direction:column;gap:3px}
    .pack-item{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;padding:3px 0}
    .pack-chk{cursor:pointer;display:flex;align-items:center;gap:6px}.pack-chk.done{text-decoration:line-through;color:var(--sub)}
    .act-btn{flex:1;min-width:80px;height:33px;border:none;border-radius:9px;font-size:11.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none}
    .act-btn.next{background:var(--grad);color:#fff}.act-btn.soft{background:var(--soft);color:var(--ink2);flex:0 0 auto;padding:0 9px}.act-btn.cancel{background:rgba(239,68,68,.15);color:#fca5a5;flex:0 0 auto;padding:0 9px}
    .kds-overlay{position:fixed;inset:0;z-index:110;background:#04070e;padding:22px;overflow:auto;display:none}.kds-overlay.open{display:block}
    .kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-top:16px}
    .kds-card{background:#111c33;border:2px solid #f97316;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}.kds-item{font-size:18px;font-weight:700;padding:6px 0;border-bottom:1px solid var(--border)}
    .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
    table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;padding:10px 13px;font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--sub);background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);white-space:nowrap}td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
    .tbl-thumb{width:38px;height:38px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;overflow:hidden;flex-shrink:0}.tbl-thumb img{width:100%;height:100%;object-fit:cover}
    .ico-btn{height:29px;padding:0 9px;border:none;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;background:var(--soft);color:var(--ink2)}.ico-btn.ok{background:rgba(16,185,129,.18);color:#34d399}.ico-btn.edit{background:rgba(59,130,246,.18);color:#93c5fd}.ico-btn.del{background:rgba(239,68,68,.16);color:#fca5a5}.ico-btn.warn{background:rgba(245,158,11,.2);color:#fcd34d}
    .stock-pill{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;display:inline-block}.stock-ok{background:rgba(16,185,129,.16);color:#6ee7b7}.stock-low{background:rgba(245,158,11,.22);color:#fcd34d}.stock-out{background:rgba(239,68,68,.22);color:#fca5a5}
    .pos-desk{display:grid;grid-template-columns:1.5fr 410px;gap:16px;align-items:start}.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
    .pos-tile{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:9px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px}.pos-tile:hover{border-color:var(--accent)}
    .pos-thumb{height:70px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}.pos-thumb img{width:100%;height:100%;object-fit:cover}
    .fin-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:15px;margin-bottom:15px}.z-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}.z-row:last-child{border-bottom:none}
    .upload-box{display:flex;align-items:center;gap:10px;background:var(--input);border:1.5px dashed var(--border-hi);border-radius:12px;padding:9px;margin-top:5px;flex-wrap:wrap}.upload-prev{width:48px;height:48px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}.upload-prev img{width:100%;height:100%;object-fit:cover}
    .file-lbl{display:inline-flex;align-items:center;gap:5px;background:var(--grad);color:#fff;padding:7px 11px;border-radius:9px;font-size:11.5px;font-weight:800;cursor:pointer}.file-lbl input{display:none}
    .modal-overlay{position:fixed;inset:0;background:rgba(2,6,15,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:95}.modal-overlay.open{display:flex}
    .modal-card{width:100%;max-width:540px;max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--border-hi);border-radius:20px;padding:20px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.modal-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--soft);color:#fff;font-weight:800;cursor:pointer}
    .empty{padding:36px 16px;text-align:center;color:var(--sub)}.toast{position:fixed;bottom:22px;right:24px;background:#10b981;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:130}.toast.show{opacity:1}
    .side-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:38}.side-backdrop.show{display:block}
    @media(max-width:1100px){.kanban,.pos-desk,.fin-grid{grid-template-columns:1fr}}
    @media(max-width:920px){.login-screen{grid-template-columns:1fr}.login-visual{display:none}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-area{margin-left:0}.menu-toggle{display:inline-flex;align-items:center;justify-content:center}.kpi-grid{grid-template-columns:1fr 1fr}.form-2,.form-3,.form-4{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="netBanner" class="net-banner">
    <span id="netBannerText">🔴 OFFLINE — Internet ýok! Kasa (POS) awtonom işleýär</span>
    <button type="button" id="syncOfflineBtn" style="border:none;background:#fff;color:#0b1120;padding:6px 13px;border-radius:9px;font-weight:800;cursor:pointer;">🔄 Sinhr. et</button>
  </div>
  <div id="root"></div>
  <div class="kds-overlay" id="kdsOverlay">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:14px;">
      <div><h2 style="font-size:24px;font-weight:800;">👨‍🍳 Aşhana Ekrany (KDS)</h2><div style="font-size:13px;color:var(--sub);">Taýýarlanmaly sargytlar</div></div>
      <button type="button" class="pill-btn closed" id="closeKdsBtn" style="font-size:14px;padding:10px 18px;">✕ Ýap (Esc)</button>
    </div>
    <div class="kds-grid" id="kdsGrid"></div>
  </div>
  <div class="modal-overlay" id="prodModal">
    <div class="modal-card">
      <div class="modal-head"><h3 id="prodModalTitle" style="font-size:17px;font-weight:800;">➕ Täze haryt</h3><button type="button" class="modal-close" data-close-modal="prodModal">✕</button></div>
      <form id="prodForm">
        <input type="hidden" id="pmId" />
        <div class="field"><label>Harydyň ady *</label><input id="pmTitle" required /></div>
        <div class="form-3"><div class="field"><label>Satuw bahasy *</label><input id="pmPrice" type="number" min="1" step="0.5" required /></div><div class="field"><label>Öňki bahasy</label><input id="pmOldPrice" type="number" min="0" step="0.5" /></div><div class="field"><label>Algy / Maliýet</label><input id="pmCost" type="number" min="0" step="0.5" /></div></div>
        <div class="form-3"><div class="field"><label>Stok sany</label><input id="pmStock" type="number" min="0" placeholder="Boş=çäksiz" /></div><div class="field"><label>SKT (Möhleti)</label><input id="pmExpiry" type="date" /></div><div class="field"><label>Barkod</label><input id="pmBarcode" placeholder="869..." /></div></div>
        <div class="form-3"><div class="field"><label>Ölçegi</label><input id="pmUnit" placeholder="1 kg / 400 g" /></div><div class="field"><label>Bölümçe</label><input id="pmCat" placeholder="Esasy" /></div><div class="field"><label>Emoji</label><input id="pmEmoji" value="📦" /></div></div>
        <div class="form-3"><div class="field"><label>Flaş baha</label><input id="pmFlashPrice" type="number" min="0" step="0.5" /></div><div class="field"><label>Flaş gutarýar</label><input id="pmFlashUntil" type="datetime-local" /></div><div class="field"><label>Terezi / Gramaj?</label><select id="pmWeighted"><option value="0">Ýok</option><option value="1">Hawa (250g/500g/1kg)</option></select></div></div>
        <div class="form-2"><div class="field"><label>Diýeta (Halal, Ajy...)</label><input id="pmDiet" placeholder="Halal, Ajy" /></div><div class="field"><label>Toptançy</label><input id="pmSupplier" /></div></div>
        <div class="field"><label>Goşmaça saýlawlar (Ady:Baha)</label><textarea id="pmOpts" placeholder="Uly porsiýa:10&#10;Sogansyz:0"></textarea></div>
        <div class="field"><label>Surat</label><div class="upload-box"><div class="upload-prev" id="pmImgPrev">📦</div><div style="flex:1;"><label class="file-lbl">📷 Surat ýükle<input type="file" accept="image/*" id="pmImgFile" /></label><input id="pmImgUrl" style="margin-top:6px;padding:6px 8px;font-size:11.5px;" placeholder="URL..." /></div></div></div>
        <button type="submit" class="btn-primary">Ýatda sakla ✓</button>
      </form>
    </div>
  </div>

        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = e => {
            const img = new Image();
            img.onload = () => {
              let w = img.width, h = img.height;
              if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
              const c = document.createElement('canvas'); c.width = w; c.height = h;
              c.getContext('2d').drawImage(img, 0, 0, w, h);
              const dataUrl = c.toDataURL('image/jpeg', 0.8);
              c.toBlob(async blob => {
                if (sb && state.session && navigator.onLine) {
                  try {
                    const path = state.session.storeId + '/' + Date.now() + '.jpg';
                    const { error } = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
                    if (!error) { const { data } = sb.storage.from('media').getPublicUrl(path); if (data?.publicUrl) return resolve(data.publicUrl); }
                  } catch {}
                }
                resolve(dataUrl);
              }, 'image/jpeg', 0.8);
            };
            img.onerror = reject; img.src = e.target.result;
          };
          r.onerror = reject; r.readAsDataURL(file);
        });
      }

          else { state.offlineQueue.push(o); saveJSON(K.OFFLINE_Q, state.offlineQueue); toast('🔴 OFFLINE ýatda saklandy — Internet gelende sinhr. ediler!'); }
          state.posCart={}; state.posGivenCash=''; render(); printReceipt(o.code, false);
        } else if (e.target.id==='addSupForm') { const s={id:Date.now(),storeId:sid(),name:document.getElementById('supName').value.trim(),phone:document.getElementById('supPhone').value.trim(),category:document.getElementById('supCat').value.trim()}; state.suppliers.unshift(s); saveJSON(K.SUPPLIERS,state.suppliers); if(sb&&navigator.onLine) await sb.from('suppliers').insert([{store_id:sid(),name:s.name,phone:s.phone,category:s.category}]); toast('Goşuldy ✓'); render(); }
        else if (e.target.id==='addWasteForm') { const p=myProducts().find(x=>x.id===document.getElementById('wProd').value); if(!p)return; const q=Number(document.getElementById('wQty').value||1), loss=(p.costPrice||p.price)*q; if(p.stockQty!==null) p.stockQty=Math.max(0,p.stockQty-q); const l={id:Date.now(),storeId:sid(),productTitle:p.title,changeQty:-q,reason:document.getElementById('wReason').value,lossAmount:loss,createdAt:Date.now()}; state.stockLogs.unshift(l); saveJSON(K.STOCKLOGS,state.stockLogs); saveJSON(K.PRODUCTS,state.products); if(sb&&navigator.onLine) await sb.from('stock_logs').insert([{store_id:sid(),product_id:p.id,product_title:p.title,change_qty:-q,reason:l.reason,loss_amount:loss}]); toast('Fire ýazyldy ✓'); render(); }
        else if (e.target.id==='addExpenseForm') { const ex={id:Date.now(),storeId:sid(),category:document.getElementById('exCat').value,amount:Number(document.getElementById('exAmt').value),note:document.getElementById('exNote').value.trim(),deducted:false,createdAt:Date.now()}; state.expenses.unshift(ex); saveJSON(K.EXPENSES,state.expenses); if(sb&&navigator.onLine) await sb.from('expenses').insert([{store_id:sid(),category:ex.category,amount:ex.amount,note:ex.note,deducted:false}]); toast('Goşuldy ✓'); render(); }
        else if (e.target.id==='addCreditForm') { const cr={id:Date.now(),storeId:sid(),customerName:document.getElementById('crName').value.trim(),customerPhone:document.getElementById('crPhone').value.trim(),balance:Number(document.getElementById('crAmt').value)}; state.credits.unshift(cr); saveJSON(K.CREDITS,state.credits); if(sb&&navigator.onLine) await sb.from('credit_ledger').insert([{store_id:sid(),customer_name:cr.customerName,customer_phone:cr.customerPhone,balance:cr.balance}]); toast('Karz ýazyldy ✓'); render(); }
        else if (e.target.id==='addBillForm') { const b={id:Date.now(),storeId:sid(),title:document.getElementById('blTitle').value.trim(),amount:Number(document.getElementById('blAmt').value),paidMonth:''}; state.bills.unshift(b); saveJSON(K.BILLS,state.bills); if(sb&&navigator.onLine) await sb.from('fixed_bills').insert([{store_id:sid(),title:b.title,amount:b.amount}]); toast('Goşuldy ✓'); render(); }
        else if (e.target.id==='addStaffForm') { const stf={id:Date.now(),storeId:sid(),name:document.getElementById('stfName').value.trim(),role:document.getElementById('stfRole').value,password:document.getElementById('stfPass').value}; state.staff.unshift(stf); saveJSON(K.STAFF,state.staff); if(sb&&navigator.onLine) await sb.from('staff_members').insert([{store_id:sid(),name:stf.name,role:stf.role,password:stf.password}]); toast('Işgär goşuldy ✓'); render(); }
        else if (e.target.id==='clockForm') {
          const stf = myStaff().find(x=>String(x.id)===String(document.getElementById('clkStaff').value));
          if (!stf || stf.password !== document.getElementById('clkPass').value) { toast('❌ Işgär paroly nädogry!'); return; }
          const cash = Number(document.getElementById('clkCash').value||0), openSh = myShifts().find(s=>s.staffName===stf.name&&!s.clockOut);
          if (openSh) { openSh.clockOut=Date.now(); openSh.closingCash=cash; if(sb&&navigator.onLine) await sb.from('staff_shifts').update({clock_out:new Date().toISOString(),closing_cash:cash}).eq('id',openSh.id); toast('👋 '+stf.name+' çalşygy tamamlady'); }
          else { const sh={id:Date.now(),storeId:sid(),staffName:stf.name,role:stf.role,clockIn:Date.now(),clockOut:null,openingCash:cash}; state.shifts.unshift(sh); if(sb&&navigator.onLine) await sb.from('staff_shifts').insert([{store_id:sid(),staff_name:sh.staffName,role:sh.role,opening_cash:cash}]); toast('🟢 '+stf.name+' çalşyga başlady'); }
          saveJSON(K.SHIFTS, state.shifts); render();
        } else if (e.target.id==='addTaskForm') { const t={id:Date.now(),storeId:sid(),title:document.getElementById('tskTitle').value.trim(),done:false}; state.tasks.unshift(t); saveJSON(K.TASKS,state.tasks); if(sb&&navigator.onLine) await sb.from('store_tasks').insert([{store_id:sid(),title:t.title,done:false}]); render(); }
        else if (e.target.id==='loyaltyForm') { await saveStoreFields({loyaltyEnabled:document.getElementById('loyEnabled').checked,loyaltyConfig:{target:Number(document.getElementById('loyTarget').value||5),type:document.getElementById('loyType').value,value:Number(document.getElementById('loyVal').value||15),days:Number(document.getElementById('loyDays').value||14)}}); toast('Saklandy ✓'); render(); }
        else if (e.target.id==='settingsForm') { localStorage.setItem(K.CLIENT_URL,document.getElementById('sClientUrl').value.trim()); await saveStoreFields({name:document.getElementById('sName').value.trim(),phone:document.getElementById('sPhone').value.trim(),announcement:document.getElementById('sAnn').value.trim(),dailyGoal:Number(document.getElementById('sGoal').value||1500),firstOrderDiscount:Number(document.getElementById('sFirstDisc').value||0),freeGiftOver:Number(document.getElementById('sGiftOver').value||0),freeGiftText:document.getElementById('sGiftText').value.trim()}); toast('Saklandy ✓'); render(); }
      });

      document.getElementById('root').addEventListener('click', async e => {
        const el = s => e.target.closest(s);
        if (el('[data-fill-email]')){document.getElementById('lEmail').value=el('[data-fill-email]').getAttribute('data-fill-email');document.getElementById('lPass').value=el('[data-fill-pass]').getAttribute('data-fill-pass');return;}
        if (el('#menuToggleBtn')){state.mobileSideOpen=!state.mobileSideOpen;render();return;}
        if (el('#sideBackdrop')){state.mobileSideOpen=false;render();return;}
        if (el('#logoutBtn')){state.session=null;localStorage.removeItem(K.SESSION);if(sb)sb.auth.signOut();render();return;}
        if (el('#toggleOpenBtn')){await saveStoreFields({isOpen:currentStore().isOpen===false});render();return;}
        if (el('#toggleBusyBtn')){const c=currentStore().busyExtraMin||0;await saveStoreFields({busyExtraMin:c===0?15:(c===15?30:0)});render();return;}
        if (el('#toggleWeatherBtn')){await saveStoreFields({weatherMode:!currentStore().weatherMode});toast('Howa tertibi täzelendi 🌧️');render();return;}
        if (el('[data-tab]')){state.tab=el('[data-tab]').getAttribute('data-tab');state.mobileSideOpen=false;render();return;}
        if (el('[data-pst]')){state.prodSubTab=el('[data-pst]').getAttribute('data-pst');render();return;}
        if (el('[data-rr]')){state.reportRange=el('[data-rr]').getAttribute('data-rr');render();return;}
        if (el('#openKdsBtn')){renderKds();document.getElementById('kdsOverlay').classList.add('open');return;}
        if (el('#mergeOrdersBtn')){const act=myOrders().filter(o=>['new','accepted','preparing'].includes(o.status)),byP={};act.forEach(o=>{const k=String(o.customerPhone).replace(/\D/g,'');if(k.length>=6){byP[k]=byP[k]||[];byP[k].push(o);}});let m=0;for(const k in byP){if(byP[k].length>=2){const [mn,...rs]=byP[k];rs.forEach(r=>{mn.items.push(...r.items);mn.total+=r.total;r.status='cancelled';m++;});}}if(m){saveJSON(K.ORDERS,state.orders);toast('🔗 '+m+' sargyt birleşdirildi!');render();}else toast('Meňzeş sargyt ýok');return;}
        if (el('[data-prio]')){const o=myOrders().find(x=>x.code===el('[data-prio]').getAttribute('data-prio'));if(o){o.isPriority=!o.isPriority;saveJSON(K.ORDERS,state.orders);render();}return;}
        if (el('[data-pack-code]')){const b=el('[data-pack-code]'),o=myOrders().find(x=>x.code===b.getAttribute('data-pack-code')),idx=+b.getAttribute('data-pack-idx');if(o){o.packedItems=o.packedItems||[];if(o.packedItems.includes(idx))o.packedItems=o.packedItems.filter(x=>x!==idx);else o.packedItems.push(idx);saveJSON(K.ORDERS,state.orders);render();}return;}
        if (el('[data-next-code]')){const b=el('[data-next-code]');updateOrderStatus(b.getAttribute('data-next-code'),b.getAttribute('data-next-st'));return;}
        if (el('[data-print]')){printReceipt(el('[data-print]').getAttribute('data-print'),false);return;}
        if (el('[data-invoice]')){printReceipt(el('[data-invoice]').getAttribute('data-invoice'),true);return;}
        if (el('[data-refund]')){const o=myOrders().find(x=>x.code===el('[data-refund]').getAttribute('data-refund'));if(!o)return;const sn=prompt('Seriýa / Kepillik №:',o.serialNo||'');if(sn!==null){o.serialNo=sn;saveJSON(K.ORDERS,state.orders);if(sb&&navigator.onLine)await sb.from('orders').update({serial_no:sn}).eq('code',o.code);toast('Saklandy ✓');render();}return;}
        if (el('[data-open-cancel]')){document.getElementById('cancelOrderCode').value=el('[data-open-cancel]').getAttribute('data-open-cancel');document.getElementById('cancelModal').classList.add('open');return;}
        if (el('#clearPosBtn')){state.posCart={};render();return;}
        if (el('[data-pos-add]')){const id=el('[data-pos-add]').getAttribute('data-pos-add');state.posCart[id]=(state.posCart[id]||0)+1;render();return;}
        if (el('[data-pos-dec]')){const id=el('[data-pos-dec]').getAttribute('data-pos-dec');state.posCart[id]=Math.max(0,(state.posCart[id]||0)-1);if(!state.posCart[id])delete state.posCart[id];render();return;}
        if (el('[data-pos-type]')){state.posOrderType=el('[data-pos-type]').getAttribute('data-pos-type');render();return;}
        if (el('[data-pos-pay]')){state.posPay=el('[data-pos-pay]').getAttribute('data-pos-pay');render();return;}
        if (el('#openAddProdBtn')){document.getElementById('pmId').value='';document.getElementById('prodForm').reset();state.modalProdImg='';document.getElementById('prodModal').classList.add('open');return;}
        if (el('[data-edit]')){const p=myProducts().find(x=>x.id===el('[data-edit]').getAttribute('data-edit'));if(!p)return;state.modalProdImg=p.imageUrl||'';document.getElementById('pmId').value=p.id;document.getElementById('pmTitle').value=p.title;document.getElementById('pmPrice').value=p.price;document.getElementById('pmOldPrice').value=p.oldPrice||'';document.getElementById('pmCost').value=p.costPrice||'';document.getElementById('pmStock').value=p.stockQty!==null&&p.stockQty!==undefined?p.stockQty:'';document.getElementById('pmExpiry').value=p.expiryDate||'';document.getElementById('pmBarcode').value=p.barcode||'';document.getElementById('pmUnit').value=p.unit||'';document.getElementById('pmCat').value=p.cat||'';document.getElementById('pmEmoji').value=p.emoji||'📦';document.getElementById('pmOpts').value=formatOpts(p.options);document.getElementById('prodModal').classList.add('open');return;}
        if (el('[data-poster]')){const p=myProducts().find(x=>x.id===el('[data-poster]').getAttribute('data-poster'));if(p)openPoster(p);return;}
        if (el('[data-bclabel]')){const p=myProducts().find(x=>x.id===el('[data-bclabel]').getAttribute('data-bclabel'));if(p)printBarcodeLabel(p);return;}
        if (el('[data-del]')){const id=el('[data-del]').getAttribute('data-del');if(confirm('Pozmak isleýärsiňizmi?')){state.products=state.products.filter(x=>x.id!==id);saveJSON(K.PRODUCTS,state.products);if(sb&&navigator.onLine)await sb.from('products').delete().eq('id',id);render();}return;}
        if (el('#deductAllExpBtn')){myExpenses().forEach(x=>x.deducted=true);saveJSON(K.EXPENSES,state.expenses);toast('Kassadan aýryldy ✓');render();return;}
        if (el('[data-pay-cr]')){const c=state.credits.find(x=>String(x.id)===el('[data-pay-cr]').getAttribute('data-pay-cr'));if(c){const a=Number(prompt('Alnan töleg:',c.balance));if(a>0){c.balance=Math.max(0,c.balance-a);saveJSON(K.CREDITS,state.credits);toast('Töleg alyndy ✓');render();}}return;}
        if (el('[data-pay-bill]')){const b=state.bills.find(x=>String(x.id)===el('[data-pay-bill]').getAttribute('data-pay-bill'));if(b){b.paidMonth=new Date().toISOString().slice(0,7);state.expenses.unshift({id:Date.now(),storeId:sid(),category:'Sabit töleg',amount:b.amount,note:b.title,deducted:true,createdAt:Date.now()});saveJSON(K.BILLS,state.bills);saveJSON(K.EXPENSES,state.expenses);toast('Tölendi ✓');render();}return;}
        if (el('[data-vip-cp-phone]')){const b=el('[data-vip-cp-phone]');document.getElementById('vcPhone').value=b.getAttribute('data-vip-cp-phone');document.getElementById('vipTargetInfo').textContent=b.getAttribute('data-vip-cp-name');document.getElementById('vcCode').value='VIP'+Math.floor(1000+Math.random()*9000);document.getElementById('vcExpires').value=new Date(Date.now()+14*86400000).toISOString().slice(0,10);document.getElementById('vipCouponModal').classList.add('open');return;}
        if (el('[data-del-staff]')){state.staff=state.staff.filter(x=>String(x.id)!==el('[data-del-staff]').getAttribute('data-del-staff'));saveJSON(K.STAFF,state.staff);render();return;}
        if (el('[data-tog-task]')){const t=state.tasks.find(x=>String(x.id)===el('[data-tog-task]').getAttribute('data-tog-task'));if(t){t.done=!t.done;saveJSON(K.TASKS,state.tasks);render();}return;}
        if (el('[data-del-task]')){state.tasks=state.tasks.filter(x=>String(x.id)!==el('[data-del-task]').getAttribute('data-del-task'));saveJSON(K.TASKS,state.tasks);render();return;}
        if (el('#backupJsonBtn')){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({products:myProducts(),coupons:state.coupons,suppliers:mySuppliers(),credits:myCredits()},null,2)],{type:'application/json'}));a.download='sahermarket_backup_'+sid()+'.json';a.click();toast('Backup ýüklendi ✓');return;}
        if (el('#exportCsvBtn')){const rows=[['Kod','Sene','Müşderi','Jemi']];myOrders().forEach(o=>rows.push([o.code,new Date(o.createdAt).toLocaleString('tr-TR'),o.customerName,o.total]));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='hasabat.csv';a.click();}
      });

      render();
      if (state.session) { syncSupabase(); syncOfflineQueue(); }
    })();
  </script>
</body>
